global:
  resolve_timeout: 5m

route:
  receiver: local-webhook
  group_by: ["alertname"]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://alert-sink:8080/alerts
        send_resolved: true
    email_configs:
      - to: ops@afterops.local
        from: alerts@afterops.local
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true

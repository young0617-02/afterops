groups:
  - name: afterops-api
    rules:
      - alert: AfterOpsApiDown
        expr: up{job="afterops-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: AfterOps API is down
          description: Prometheus has failed to scrape the API for 30 seconds.

      - alert: AfterOpsHighErrorRatio
        expr: |
          sum(rate(afterops_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(afterops_http_requests_total[5m])), 0.001)
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: AfterOps 5xx ratio above 5%
          description: The API has returned 5xx for more than 5% of requests for 2 minutes.

      - alert: AfterOpsHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(afterops_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: AfterOps p95 latency above 500ms
          description: API p95 latency has exceeded 500ms for 5 minutes.

      - alert: AfterOpsRateLimitSpike
        expr: sum(rate(afterops_http_requests_total{status="429"}[5m])) > 0.2
        for: 2m
        labels:
          severity: info
        annotations:
          summary: Elevated 429 rate
          description: More than 0.2 rate-limited requests per second for 2 minutes.

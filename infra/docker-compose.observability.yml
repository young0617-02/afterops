# Optional observability overlay for docker-compose.prod.yml.
# Usage:
#   docker compose -p afterops-prod \
#     -f docker-compose.prod.yml -f docker-compose.observability.yml \
#     --env-file .env.prod up -d
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_SERVICE_NAME: afterops-api
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "127.0.0.1:${PROD_TEMPO_PORT:-13200}:3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - prod_tempo_data:/var/tempo
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROD_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prod_prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${PROD_ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - prod_alertmanager_data:/alertmanager
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  alert-sink:
    build:
      context: ./alertsink
    ports:
      - "127.0.0.1:${PROD_ALERT_SINK_PORT:-18081}:8080"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:${PROD_GRAFANA_PORT:-13001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - prod_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped
    logging: *default-logging

volumes:
  prod_prometheus_data:
  prod_grafana_data:
  prod_alertmanager_data:
  prod_tempo_data:
